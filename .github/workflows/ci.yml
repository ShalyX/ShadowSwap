name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck:golden
      - name: Reject insecure lockfile sources
        run: |
          node -e "if(require('fs').readFileSync('package-lock.json','utf8').includes('\"resolved\": \"http://'))process.exit(1)"
      - run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - name: Reject insecure lockfile sources
        run: |
          node -e "if(require('fs').readFileSync('package-lock.json','utf8').includes('\"resolved\": \"http://'))process.exit(1)"
      - run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
